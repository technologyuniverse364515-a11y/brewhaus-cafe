<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reserve a Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="reserve">
  <nav class="nav" id="nav"></nav>

  <header class="page-header">
    <img id="pageHeroImg" alt="" />
    <h1 id="pageTitle"></h1>
    <p id="pageSubtitle"></p>
  </header>

  <div class="container">
    <div class="form-wrap">
      <div class="urgency-pill" id="urgencyPill"></div>
      <form id="reserveForm" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label id="labelName" for="name"></label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-field">
            <label id="labelPhone" for="phone"></label>
            <input type="tel" id="phone" name="phone" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label id="labelDate" for="date"></label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="form-field">
            <label id="labelTime" for="time"></label>
            <input type="time" id="time" name="time" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label id="labelGuests" for="guests"></label>
            <select id="guests" name="guests" required>
              <option value="">Select</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8+</option>
            </select>
          </div>
          <div class="form-field">
            <label id="labelNotes" for="notes"></label>
            <input type="text" id="notes" name="notes" placeholder="High chair, allergies, etc." />
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%;margin-top:8px"></button>
        <div id="formMsg" class="form-msg"></div>
      </form>
    </div>
  </div>

  <div style="height:80px"></div>

  <footer id="footer"></footer>
  <div class="sticky-cta" id="stickyCta"></div>

  <script src="config/buttons.js"></script>
  <script src="config/text.js"></script>
  <script src="config/messages.js"></script>
  <script src="config/images.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
