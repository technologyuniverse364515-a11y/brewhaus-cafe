<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="events">
  <nav class="nav" id="nav"></nav>

  <header class="page-header">
    <img id="pageHeroImg" alt="" />
    <h1 id="pageTitle"></h1>
    <p id="pageSubtitle"></p>
  </header>

  <section class="section">
    <div class="container">
      <div class="grid grid-2" id="eventsGrid"></div>
    </div>
  </section>

  <section class="section alt-bg">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Schedule</span>
        <h2 id="scheduleTitle"></h2>
      </div>
      <div class="schedule" id="schedule"></div>
    </div>
  </section>

  <footer id="footer"></footer>
  <div class="sticky-cta" id="stickyCta"></div>

  <script src="config/buttons.js"></script>
  <script src="config/text.js"></script>
  <script src="config/messages.js"></script>
  <script src="config/images.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
